<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c4f3b" />
  <meta name="description" content="运动会羽毛球项目参赛管理、智能抽签与场地调度工具" />
  
  <style>
:root {
  --ink: #17211b;
  --muted: #6d786f;
  --line: #dfe5dd;
  --paper: #ffffff;
  --canvas: #f4f6f1;
  --green-950: #062f23;
  --green-900: #0b4534;
  --green-800: #0c5b44;
  --green-700: #147a5b;
  --green-100: #dff3e8;
  --lime: #dfff73;
  --orange: #ff6b35;
  --red: #d94747;
  --shadow: 0 12px 34px rgba(21, 58, 41, 0.09);
  --shadow-soft: 0 4px 16px rgba(21, 58, 41, 0.06);
  --radius: 22px;
  --radius-sm: 14px;
  font-family: "DM Sans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--ink);
  background: var(--canvas);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  min-height: 100%;
  scroll-behavior: smooth;
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  background:
    radial-gradient(circle at 90% 4%, rgba(223, 255, 115, 0.2), transparent 25rem),
    var(--canvas);
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid rgba(20, 122, 91, 0.28);
  outline-offset: 2px;
}

button,
a {
  touch-action: manipulation;
}

.app-shell {
  min-height: 100vh;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  height: 74px;
  padding: 0 max(20px, calc((100vw - 1240px) / 2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  color: #fff;
  background: rgba(6, 47, 35, 0.97);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(18px);
}

.brand {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 40px;
  height: 40px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 13px;
  background: var(--lime);
  box-shadow: inset 0 -5px 12px rgba(32, 79, 20, 0.13);
}

.brand-mark svg {
  width: 27px;
  height: 27px;
}

.brand-copy {
  min-width: 0;
}

.brand-copy strong {
  display: block;
  font-size: 18px;
  line-height: 1.2;
  letter-spacing: 0.02em;
}

.brand-copy span {
  display: block;
  max-width: 290px;
  margin-top: 3px;
  overflow: hidden;
  color: rgba(255, 255, 255, 0.65);
  font-size: 11px;
  line-height: 1.2;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.live-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 12px;
  color: rgba(255, 255, 255, 0.8);
  font-size: 12px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 999px;
}

.live-chip::before {
  width: 7px;
  height: 7px;
  content: "";
  background: var(--lime);
  border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(223, 255, 115, 0.13);
}

.header-icon-button {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  color: #fff;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  cursor: pointer;
}

.header-icon-button:hover {
  background: rgba(255, 255, 255, 0.14);
}

.desktop-tabs {
  position: sticky;
  top: 74px;
  z-index: 25;
  height: 58px;
  padding: 0 max(20px, calc((100vw - 1240px) / 2));
  display: flex;
  align-items: stretch;
  gap: 26px;
  background: rgba(244, 246, 241, 0.92);
  border-bottom: 1px solid rgba(215, 223, 214, 0.82);
  backdrop-filter: blur(16px);
}

.nav-tab {
  position: relative;
  padding: 0;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 650;
  background: none;
  border: 0;
  cursor: pointer;
}

.nav-tab::after {
  position: absolute;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 3px;
  content: "";
  background: var(--green-700);
  border-radius: 3px 3px 0 0;
  opacity: 0;
  transform: scaleX(0.4);
  transition: 160ms ease;
}

.nav-tab.active {
  color: var(--green-800);
}

.nav-tab.active::after {
  opacity: 1;
  transform: scaleX(1);
}

.nav-tab svg {
  width: 17px;
  height: 17px;
}

.page-wrap {
  max-width: 1240px;
  min-height: calc(100vh - 132px);
  margin: 0 auto;
  padding: 28px 20px 58px;
}

.hero {
  position: relative;
  min-height: 302px;
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0, 1.18fr) minmax(300px, 0.82fr);
  color: #fff;
  background:
    linear-gradient(115deg, rgba(6, 47, 35, 0.98), rgba(12, 91, 68, 0.94)),
    var(--green-900);
  border-radius: 30px;
  box-shadow: 0 22px 60px rgba(6, 47, 35, 0.16);
}

.hero::before {
  position: absolute;
  top: -140px;
  right: 34%;
  width: 320px;
  height: 320px;
  content: "";
  border: 56px solid rgba(223, 255, 115, 0.05);
  border-radius: 50%;
}

.hero-copy {
  position: relative;
  z-index: 1;
  padding: 36px 38px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  color: var(--lime);
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.eyebrow::before {
  width: 23px;
  height: 1px;
  content: "";
  background: currentColor;
}

.hero h1 {
  max-width: 590px;
  margin: 0;
  font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
  font-size: clamp(34px, 4vw, 54px);
  font-weight: 700;
  line-height: 1.12;
  letter-spacing: -0.04em;
}

.hero p {
  max-width: 540px;
  margin: 15px 0 0;
  color: rgba(255, 255, 255, 0.65);
  font-size: 14px;
  line-height: 1.75;
}

.hero-actions {
  margin-top: 24px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.hero-side {
  position: relative;
  min-height: 302px;
  padding: 26px;
  display: flex;
  align-items: flex-end;
}

.court-art {
  position: absolute;
  top: 16px;
  right: 15px;
  width: 87%;
  height: 82%;
  opacity: 0.36;
  transform: rotate(-8deg) perspective(500px) rotateX(48deg) rotateZ(-10deg);
  transform-origin: center;
}

.court-art .court-line {
  position: absolute;
  border: 1.5px solid rgba(255, 255, 255, 0.72);
}

.court-art .court-line.outer {
  inset: 26px 0 0 18px;
}

.court-art .court-line.half {
  top: 26px;
  right: 0;
  bottom: 0;
  left: 18px;
  border-width: 0 1px;
  border-color: rgba(255, 255, 255, 0.72);
}

.court-art .court-line.long {
  top: 26px;
  right: 0;
  bottom: 0;
  left: 18px;
  border-width: 1px 0;
}

.court-art .court-line.short {
  top: 76px;
  right: 0;
  bottom: 50px;
  left: 18px;
  border-width: 1px 0;
}

.court-art .court-line.service {
  top: 26px;
  bottom: 0;
  left: 44%;
  width: 12%;
  border-width: 0 1px;
}

.court-art .net {
  position: absolute;
  top: -7px;
  bottom: 7px;
  left: 50%;
  width: 1px;
  background: rgba(223, 255, 115, 0.9);
  box-shadow: 0 0 12px rgba(223, 255, 115, 0.5);
}

.court-art .shuttle {
  position: absolute;
  top: 24%;
  left: 28%;
  width: 17px;
  height: 17px;
  background: var(--lime);
  border-radius: 50% 30% 30% 50%;
  box-shadow: 0 0 18px rgba(223, 255, 115, 0.5);
}

.hero-stats {
  position: relative;
  z-index: 2;
  width: 100%;
  padding: 18px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 19px;
  backdrop-filter: blur(16px);
}

.hero-stat {
  padding: 1px 15px;
  border-right: 1px solid rgba(255, 255, 255, 0.12);
}

.hero-stat:first-child {
  padding-left: 0;
}

.hero-stat:last-child {
  padding-right: 0;
  border-right: 0;
}

.hero-stat strong {
  display: block;
  color: var(--lime);
  font-family: "Noto Serif SC", "Songti SC", serif;
  font-size: 27px;
  line-height: 1.1;
}

.hero-stat span {
  display: block;
  margin-top: 5px;
  color: rgba(255, 255, 255, 0.58);
  font-size: 11px;
  white-space: nowrap;
}

.button {
  min-height: 43px;
  padding: 10px 17px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 2px 6px rgba(21, 58, 41, 0.04);
  cursor: pointer;
  transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
}

.button:hover {
  box-shadow: var(--shadow-soft);
  transform: translateY(-1px);
}

.button:active {
  transform: translateY(0) scale(0.98);
}

.button svg {
  width: 17px;
  height: 17px;
  flex: 0 0 auto;
}

.button.primary {
  color: #103125;
  background: var(--lime);
  border-color: var(--lime);
  box-shadow: 0 8px 20px rgba(185, 221, 61, 0.16);
}

.button.dark {
  color: #fff;
  background: var(--green-800);
  border-color: var(--green-800);
}

.button.ghost {
  color: var(--green-800);
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.17);
  box-shadow: none;
}

.hero .button.ghost {
  color: #fff;
}

.button.small {
  min-height: 34px;
  padding: 7px 11px;
  border-radius: 9px;
  font-size: 12px;
}

.button.icon-only {
  width: 36px;
  min-height: 36px;
  padding: 0;
}

.button.danger {
  color: var(--red);
  border-color: rgba(217, 71, 71, 0.18);
}

.button[disabled] {
  pointer-events: none;
  opacity: 0.45;
}

.section-grid {
  margin-top: 22px;
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(290px, 0.75fr);
  gap: 18px;
}

.card {
  min-width: 0;
  padding: 22px;
  background: var(--paper);
  border: 1px solid rgba(215, 223, 214, 0.82);
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
}

.card.flush {
  padding: 0;
  overflow: hidden;
}

.card-header {
  margin-bottom: 18px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 15px;
}

.card-title {
  min-width: 0;
}

.card-title h2,
.card-title h3 {
  margin: 0;
  font-family: "Noto Serif SC", "Songti SC", serif;
  font-size: 21px;
  line-height: 1.25;
  letter-spacing: -0.02em;
}

.card-title p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

.text-button {
  padding: 4px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--green-700);
  font-size: 12px;
  font-weight: 650;
  background: none;
  border: 0;
  cursor: pointer;
}

.text-button svg {
  width: 14px;
  height: 14px;
}

.quick-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.quick-action {
  min-height: 94px;
  padding: 15px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  text-align: left;
  color: var(--ink);
  background: #f7f9f5;
  border: 1px solid #e8ece6;
  border-radius: 16px;
  cursor: pointer;
}

.quick-action:hover {
  background: var(--green-100);
  border-color: #cde8db;
}

.quick-icon {
  width: 33px;
  height: 33px;
  display: grid;
  place-items: center;
  color: var(--green-700);
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(20, 80, 57, 0.07);
}

.quick-icon svg {
  width: 18px;
  height: 18px;
}

.quick-action strong {
  margin-top: 13px;
  font-size: 13px;
}

.quick-action span {
  margin-top: 2px;
  color: var(--muted);
  font-size: 10px;
}

.next-game-list {
  display: grid;
  gap: 9px;
}

.next-game {
  padding: 13px 14px;
  display: grid;
  grid-template-columns: 45px minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  background: #f7f9f5;
  border: 1px solid #edf0ea;
  border-radius: 14px;
}

.game-time {
  color: var(--green-800);
  font-size: 11px;
  font-weight: 750;
  text-align: center;
}

.game-time span {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 500;
}

.game-matchup {
  min-width: 0;
}

.game-matchup strong {
  display: block;
  overflow: hidden;
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.game-matchup span {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 10px;
}

.status-pill {
  padding: 5px 8px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--green-700);
  font-size: 9px;
  font-weight: 700;
  background: var(--green-100);
  border-radius: 999px;
  white-space: nowrap;
}

.status-pill.warn {
  color: #9a5b00;
  background: #fff0d3;
}

.status-pill.danger {
  color: #b83232;
  background: #ffe4e4;
}

.status-pill.gray {
  color: #667169;
  background: #ecefeb;
}

.empty {
  padding: 42px 20px;
  text-align: center;
}

.empty-mark {
  width: 66px;
  height: 66px;
  margin: 0 auto 13px;
  display: grid;
  place-items: center;
  color: var(--green-700);
  font-size: 26px;
  background: var(--green-100);
  border-radius: 22px;
  transform: rotate(-4deg);
}

.empty strong {
  display: block;
  font-size: 14px;
}

.empty p {
  max-width: 350px;
  margin: 6px auto 16px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.65;
}

.page-heading {
  margin-bottom: 18px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
}

.page-heading h1 {
  margin: 0;
  font-family: "Noto Serif SC", "Songti SC", serif;
  font-size: clamp(27px, 3vw, 36px);
  line-height: 1.2;
  letter-spacing: -0.035em;
}

.page-heading p {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.heading-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.stats-row {
  margin-bottom: 18px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.stat-card {
  position: relative;
  min-width: 0;
  padding: 17px 18px;
  overflow: hidden;
  background: var(--paper);
  border: 1px solid rgba(215, 223, 214, 0.82);
  border-radius: 17px;
  box-shadow: var(--shadow-soft);
}

.stat-card::after {
  position: absolute;
  top: -22px;
  right: -22px;
  width: 62px;
  height: 62px;
  content: "";
  background: var(--green-100);
  border-radius: 50%;
  opacity: 0.65;
}

.stat-card span {
  color: var(--muted);
  font-size: 11px;
}

.stat-card strong {
  position: relative;
  display: block;
  margin-top: 6px;
  font-family: "Noto Serif SC", "Songti SC", serif;
  font-size: 25px;
  line-height: 1;
}

.stat-card strong small {
  color: var(--muted);
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
}

.toolbar {
  margin-bottom: 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.toolbar-left,
.toolbar-right {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.search-field {
  position: relative;
  min-width: 218px;
}

.search-field svg {
  position: absolute;
  top: 50%;
  left: 12px;
  width: 16px;
  height: 16px;
  color: var(--muted);
  pointer-events: none;
  transform: translateY(-50%);
}

.search-field input {
  width: 100%;
  height: 40px;
  padding: 0 12px 0 36px;
  color: var(--ink);
  font-size: 12px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 11px;
}

.select {
  height: 40px;
  max-width: 180px;
  padding: 0 32px 0 12px;
  color: var(--ink);
  font-size: 12px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 11px;
  cursor: pointer;
}

.chip-row {
  margin-bottom: 15px;
  display: flex;
  gap: 7px;
  overflow-x: auto;
  scrollbar-width: none;
}

.chip-row::-webkit-scrollbar {
  display: none;
}

.filter-chip {
  flex: 0 0 auto;
  padding: 8px 12px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 650;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  cursor: pointer;
}

.filter-chip.active {
  color: #fff;
  background: var(--green-800);
  border-color: var(--green-800);
}

.table-card {
  overflow: hidden;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow-soft);
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.data-table th {
  padding: 11px 14px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 650;
  text-align: left;
  background: #f7f9f5;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

.data-table td {
  padding: 13px 14px;
  color: #3f4a42;
  border-bottom: 1px solid #edf0ea;
}

.data-table tr:last-child td {
  border-bottom: 0;
}

.data-table tbody tr:hover {
  background: #fbfcfa;
}

.person {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 33px;
  height: 33px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  color: var(--green-800);
  font-size: 12px;
  font-weight: 750;
  background: var(--green-100);
  border-radius: 50%;
}

.person-copy strong {
  display: block;
  color: var(--ink);
  font-size: 12px;
}

.person-copy span {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 10px;
}

.table-actions {
  display: flex;
  justify-content: flex-end;
  gap: 5px;
}

.event-tag {
  padding: 5px 8px;
  display: inline-block;
  color: var(--green-700);
  font-size: 10px;
  font-weight: 650;
  background: var(--green-100);
  border-radius: 7px;
  white-space: nowrap;
}

.seed-mark {
  margin-left: 5px;
  color: #b57a00;
  font-size: 9px;
  font-weight: 700;
}

.empty-table {
  padding: 55px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}

.mobile-cards {
  display: none;
}

.mobile-person-card {
  padding: 15px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 15px;
  box-shadow: var(--shadow-soft);
}

.mobile-person-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.mobile-person-meta {
  margin-top: 12px;
  padding-top: 11px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  border-top: 1px solid #edf0ea;
}

.draw-layout {
  display: grid;
  grid-template-columns: 245px minmax(0, 1fr);
  gap: 16px;
}

.draw-sidebar {
  align-self: start;
  padding: 17px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow-soft);
}

.draw-sidebar h3 {
  margin: 0 0 12px;
  font-size: 13px;
}

.event-selector {
  display: grid;
  gap: 7px;
}

.event-select-item {
  width: 100%;
  padding: 11px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  text-align: left;
  color: var(--ink);
  background: #f7f9f5;
  border: 1px solid transparent;
  border-radius: 11px;
  cursor: pointer;
}

.event-select-item:hover {
  background: #f0f5ee;
}

.event-select-item.active {
  color: var(--green-800);
  background: var(--green-100);
  border-color: #c8e5d6;
}

.event-select-item strong {
  display: block;
  font-size: 12px;
}

.event-select-item span {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 9px;
}

.event-select-item b {
  min-width: 25px;
  padding: 4px 7px;
  color: var(--green-800);
  font-size: 10px;
  text-align: center;
  background: #fff;
  border-radius: 999px;
}

.draw-note {
  margin-top: 14px;
  padding: 12px;
  color: #526158;
  font-size: 10px;
  line-height: 1.6;
  background: #f4f7f1;
  border-radius: 11px;
}

.bracket-card {
  min-width: 0;
  padding: 20px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow-soft);
}

.bracket-topbar {
  margin-bottom: 17px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 15px;
}

.bracket-topbar h2 {
  margin: 0;
  font-family: "Noto Serif SC", "Songti SC", serif;
  font-size: 21px;
}

.bracket-topbar p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 11px;
}

.draw-actions {
  display: flex;
  gap: 7px;
}

.bracket-scroll {
  overflow-x: auto;
  padding-bottom: 10px;
  scrollbar-color: #d1ded5 transparent;
  scrollbar-width: thin;
}

.bracket {
  min-width: 780px;
  min-height: 340px;
  display: flex;
  align-items: stretch;
  gap: 32px;
}

.bracket-round {
  min-width: 178px;
  display: flex;
  flex: 0 0 178px;
  flex-direction: column;
}

.bracket-round-title {
  margin-bottom: 11px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0.08em;
}

.round-matches {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  gap: 9px;
}

.match-card {
  position: relative;
  overflow: hidden;
  color: var(--ink);
  background: #f9fbf8;
  border: 1px solid #e6ebe5;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(21, 58, 41, 0.035);
}

.match-card::after {
  position: absolute;
  top: 50%;
  right: -33px;
  width: 32px;
  height: 1px;
  content: "";
  background: #dfe6df;
}

.bracket-round:last-child .match-card::after {
  display: none;
}

.match-slot {
  min-height: 31px;
  padding: 7px 9px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  font-size: 10px;
  line-height: 1.2;
  border-bottom: 1px solid #e9ede8;
}

.match-slot:last-child {
  border-bottom: 0;
}

.match-slot span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.match-slot em {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 9px;
  font-style: normal;
}

.match-slot.winner {
  color: var(--green-800);
  font-weight: 700;
  background: rgba(223, 243, 232, 0.55);
}

.match-slot.bye {
  color: #a2aca4;
  font-style: italic;
}

.match-meta {
  padding: 5px 8px;
  display: flex;
  justify-content: space-between;
  gap: 5px;
  color: var(--muted);
  font-size: 8px;
  background: #f3f6f1;
  border-top: 1px solid #e9ede8;
}

.final-column {
  min-width: 206px;
  padding-top: 4px;
  display: flex;
  flex: 0 0 206px;
  flex-direction: column;
  justify-content: center;
}

.champion-card {
  padding: 17px;
  text-align: center;
  background: linear-gradient(145deg, #fff9df, #fffdf4);
  border: 1px solid #efe4b7;
  border-radius: 14px;
}

.champion-card .cup {
  font-size: 24px;
}

.champion-card small {
  display: block;
  margin-top: 5px;
  color: #9e7b20;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.champion-card strong {
  display: block;
  margin-top: 7px;
  font-family: "Noto Serif SC", "Songti SC", serif;
  font-size: 16px;
}

.dispatch-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 16px;
}

.schedule-card {
  min-width: 0;
  overflow: hidden;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 19px;
  box-shadow: var(--shadow-soft);
}

.schedule-head {
  padding: 17px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid var(--line);
}

.schedule-head h2 {
  margin: 0;
  font-family: "Noto Serif SC", "Songti SC", serif;
  font-size: 19px;
}

.schedule-head p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 10px;
}

.date-switcher {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px;
  background: #f3f6f1;
  border-radius: 10px;
}

.date-switcher button {
  min-width: 31px;
  height: 29px;
  display: grid;
  place-items: center;
  color: var(--muted);
  background: transparent;
  border: 0;
  border-radius: 7px;
  cursor: pointer;
}

.date-switcher button:hover {
  color: var(--green-800);
  background: #fff;
}

.date-switcher span {
  padding: 0 5px;
  color: var(--ink);
  font-size: 11px;
  font-weight: 650;
}

.timeline {
  overflow-x: auto;
}

.timeline-grid {
  min-width: 680px;
  display: grid;
  grid-template-columns: 64px repeat(var(--court-count), minmax(150px, 1fr));
}

.timeline-cell {
  min-height: 74px;
  padding: 9px;
  border-right: 1px solid #edf0ea;
  border-bottom: 1px solid #edf0ea;
}

.timeline-cell:nth-child(n) {
  min-width: 0;
}

.timeline-cell.header {
  min-height: 42px;
  padding: 10px 8px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 650;
  text-align: center;
  background: #f7f9f5;
}

.timeline-cell.time {
  color: var(--green-800);
  font-size: 10px;
  font-weight: 700;
  text-align: center;
  background: #fbfcfa;
}

.timeline-cell.time span {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 8px;
  font-weight: 500;
}

.slot-add {
  width: 100%;
  min-height: 54px;
  display: grid;
  place-items: center;
  color: #a4ada6;
  font-size: 10px;
  background: transparent;
  border: 1px dashed transparent;
  border-radius: 9px;
  cursor: pointer;
}

.slot-add:hover {
  color: var(--green-700);
  background: #f7faf6;
  border-color: #cfddd3;
}

.scheduled-match {
  position: relative;
  min-height: 56px;
  padding: 9px 9px 9px 12px;
  color: var(--ink);
  background: #edf7f1;
  border: 1px solid #d3ebde;
  border-radius: 9px;
  box-shadow: 0 2px 6px rgba(20, 80, 57, 0.04);
  cursor: pointer;
}

.scheduled-match::before {
  position: absolute;
  top: 9px;
  bottom: 9px;
  left: 5px;
  width: 3px;
  content: "";
  background: var(--green-700);
  border-radius: 3px;
}

.scheduled-match.warning {
  background: #fff7e7;
  border-color: #f1dfba;
}

.scheduled-match.warning::before {
  background: #e2a53a;
}

.scheduled-match strong {
  display: block;
  overflow: hidden;
  font-size: 9px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.scheduled-match span {
  display: block;
  margin-top: 4px;
  overflow: hidden;
  color: var(--muted);
  font-size: 8px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.scheduled-match b {
  margin-top: 5px;
  display: block;
  color: var(--green-700);
  font-size: 8px;
  font-weight: 650;
}

.side-stack {
  min-width: 0;
  display: grid;
  align-content: start;
  gap: 14px;
}

.staff-list,
.court-list,
.unscheduled-list {
  display: grid;
  gap: 8px;
}

.staff-item,
.court-item {
  padding: 10px;
  display: flex;
  align-items: center;
  gap: 9px;
  background: #f8faf7;
  border: 1px solid #ecf0ea;
  border-radius: 11px;
}

.staff-item .avatar {
  width: 30px;
  height: 30px;
  font-size: 10px;
}

.staff-info,
.court-info {
  min-width: 0;
  flex: 1;
}

.staff-info strong,
.court-info strong {
  display: block;
  overflow: hidden;
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.staff-info span,
.court-info span {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 8px;
}

.court-num {
  width: 31px;
  height: 31px;
  display: grid;
  place-items: center;
  color: var(--green-800);
  font-family: "Noto Serif SC", serif;
  font-size: 14px;
  font-weight: 700;
  background: #fff;
  border: 1px solid #dfe9e1;
  border-radius: 8px;
}

.court-item.inactive {
  opacity: 0.5;
}

.dot {
  width: 6px;
  height: 6px;
  flex: 0 0 auto;
  background: #35ad73;
  border-radius: 50%;
}

.dot.off {
  background: #a8afa9;
}

.list-more {
  width: 100%;
  padding: 8px;
  color: var(--green-700);
  font-size: 9px;
  font-weight: 650;
  background: #f7f9f5;
  border: 1px solid #ecf0ea;
  border-radius: 9px;
  cursor: pointer;
}

.settings-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(270px, 0.7fr);
  gap: 16px;
}

.settings-card + .settings-card {
  margin-top: 14px;
}

.setting-row {
  padding: 13px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border-bottom: 1px solid #edf0ea;
}

.setting-row:last-child {
  border-bottom: 0;
}

.setting-copy strong {
  display: block;
  font-size: 12px;
}

.setting-copy span {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.45;
}

.event-config {
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: #f8faf7;
  border: 1px solid #edf0ea;
  border-radius: 11px;
}

.event-config + .event-config {
  margin-top: 7px;
}

.event-config strong {
  display: block;
  font-size: 11px;
}

.event-config span {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 9px;
}

.danger-zone {
  border-color: #f3d8d8;
}

.danger-zone .card-title h3 {
  color: #a53030;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  padding: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(4, 25, 18, 0.54);
  backdrop-filter: blur(6px);
  animation: fadeIn 160ms ease both;
}

.modal {
  width: min(540px, 100%);
  max-height: min(88vh, 780px);
  overflow: auto;
  background: #fff;
  border-radius: 22px;
  box-shadow: 0 28px 80px rgba(3, 22, 15, 0.28);
  animation: modalIn 200ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
}

.modal.wide {
  width: min(700px, 100%);
}

.modal-head {
  position: sticky;
  top: 0;
  z-index: 2;
  padding: 20px 22px 15px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  background: #fff;
  border-bottom: 1px solid #edf0ea;
}

.modal-head h2 {
  margin: 0;
  font-family: "Noto Serif SC", "Songti SC", serif;
  font-size: 21px;
}

.modal-head p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 11px;
}

.modal-close {
  width: 33px;
  height: 33px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  color: var(--muted);
  background: #f4f6f1;
  border: 0;
  border-radius: 9px;
  cursor: pointer;
}

.modal-body {
  padding: 20px 22px;
}

.modal-foot {
  position: sticky;
  bottom: 0;
  z-index: 2;
  padding: 14px 22px 18px;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: #fff;
  border-top: 1px solid #edf0ea;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.field {
  min-width: 0;
}

.field.full {
  grid-column: 1 / -1;
}

.field label {
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
  color: #445048;
  font-size: 11px;
  font-weight: 650;
}

.field label em {
  color: var(--red);
  font-style: normal;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  min-height: 42px;
  padding: 10px 11px;
  color: var(--ink);
  font-size: 12px;
  background: #f9faf8;
  border: 1px solid #dfe5dd;
  border-radius: 10px;
  transition: 140ms ease;
}

.field textarea {
  min-height: 85px;
  resize: vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  background: #fff;
  border-color: #8ac4aa;
  outline: 3px solid rgba(20, 122, 91, 0.1);
}

.field-hint {
  margin-top: 5px;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.4;
}

.form-section-title {
  grid-column: 1 / -1;
  margin: 5px 0 -4px;
  padding-top: 10px;
  color: var(--green-800);
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0.08em;
  border-top: 1px solid #edf0ea;
}

.check-row {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.check-chip {
  position: relative;
}

.check-chip input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.check-chip span {
  padding: 8px 11px;
  display: inline-block;
  color: var(--muted);
  font-size: 10px;
  background: #f5f7f3;
  border: 1px solid var(--line);
  border-radius: 9px;
  cursor: pointer;
}

.check-chip input:checked + span {
  color: var(--green-800);
  font-weight: 650;
  background: var(--green-100);
  border-color: #bfe2d1;
}

.switch {
  position: relative;
  width: 40px;
  height: 23px;
  flex: 0 0 auto;
}

.switch input {
  position: absolute;
  opacity: 0;
}

.switch span {
  position: absolute;
  inset: 0;
  background: #d6ddd6;
  border-radius: 999px;
  cursor: pointer;
  transition: 160ms ease;
}

.switch span::after {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 17px;
  height: 17px;
  content: "";
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.16);
  transition: 160ms ease;
}

.switch input:checked + span {
  background: var(--green-700);
}

.switch input:checked + span::after {
  transform: translateX(17px);
}

.confirm-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto 14px;
  display: grid;
  place-items: center;
  color: var(--red);
  font-size: 24px;
  background: #ffecec;
  border-radius: 18px;
}

.confirm-copy {
  text-align: center;
}

.confirm-copy h2 {
  margin: 0;
  font-family: "Noto Serif SC", "Songti SC", serif;
  font-size: 21px;
}

.confirm-copy p {
  margin: 8px auto 0;
  max-width: 380px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.toast {
  position: fixed;
  right: 50%;
  bottom: 92px;
  z-index: 200;
  max-width: calc(100vw - 32px);
  padding: 11px 16px;
  color: #fff;
  font-size: 12px;
  line-height: 1.5;
  text-align: center;
  background: rgba(6, 47, 35, 0.95);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 11px;
  box-shadow: 0 10px 30px rgba(6, 47, 35, 0.24);
  opacity: 0;
  pointer-events: none;
  transform: translate(50%, 10px);
  transition: 180ms ease;
}

.toast.show {
  opacity: 1;
  transform: translate(50%, 0);
}

.toast.error {
  background: rgba(130, 34, 34, 0.96);
}

.bottom-nav {
  display: none;
}

.fade-view {
  animation: viewIn 220ms ease both;
}

.sort-button {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  color: inherit;
  font: inherit;
  background: none;
  border: 0;
  cursor: pointer;
}

.sort-button.active {
  color: var(--green-800);
}

.callout {
  margin-bottom: 15px;
  padding: 12px 14px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  color: #526158;
  font-size: 10px;
  line-height: 1.6;
  background: #edf7f1;
  border: 1px solid #d6ebdf;
  border-radius: 11px;
}

.callout.warn {
  color: #74551d;
  background: #fff7e6;
  border-color: #f0e0be;
}

.callout svg {
  width: 15px;
  height: 15px;
  flex: 0 0 auto;
  margin-top: 1px;
}

.legend {
  margin-top: 13px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  color: var(--muted);
  font-size: 9px;
}

.legend span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.legend i {
  width: 8px;
  height: 8px;
  display: inline-block;
  background: #d5eee0;
  border: 1px solid #a9d5be;
  border-radius: 2px;
}

.legend i.warn {
  background: #fff0d6;
  border-color: #dfc58d;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(14px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes viewIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 1020px) {
  .hero {
    grid-template-columns: minmax(0, 1fr) 310px;
  }

  .hero-copy {
    padding: 30px;
  }

  .hero h1 {
    font-size: 39px;
  }

  .section-grid {
    grid-template-columns: minmax(0, 1.4fr) minmax(270px, 0.7fr);
  }

  .dispatch-layout {
    grid-template-columns: minmax(0, 1fr) 280px;
  }
}

@media (max-width: 820px) {
  body {
    background: var(--canvas);
  }

  .topbar {
    height: 64px;
    padding: 0 16px;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    border-radius: 11px;
  }

  .brand-copy strong {
    font-size: 16px;
  }

  .brand-copy span {
    max-width: 190px;
    font-size: 9px;
  }

  .live-chip {
    display: none;
  }

  .desktop-tabs {
    display: none;
  }

    copy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>`,
  };

  function makeId(prefix = "id") {
    if (window.crypto && typeof window.crypto.randomUUID === "function") {
      return `${prefix}-${window.crypto.randomUUID()}`;
    }
    return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
  }

  function esc(value = "") {
    return String(value).replace(/[&<>"']/g, (character) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;",
    })[character]);
  }

  function shuffle(items, secure = true) {
    const list = [...items];
    for (let index = list.length - 1; index > 0; index -= 1) {
      const random = secure && window.crypto
        ? window.crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296
        : Math.random();
      const target = Math.floor(random * (index + 1));
      [list[index], list[target]] = [list[target], list[index]];
    }
    return list;
  }

  function defaultState() {
    return {
      version: 1,
      config: {
        name: "运动会羽毛球项目",
        venue: "警体馆三楼",
        date: "2026-11-13",
        times: [...DEFAULT_TIMES],

        demo: true,
      },

      staff: initialStaff(),
      courts: initialCourts(),
      draws: {},
    };
  }

  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return defaultState();
      const parsed = JSON.parse(saved);
      return {
        ...defaultState(),
        ...parsed,
        config: { ...defaultState().config, ...(parsed.config || {}) },
        draws: parsed.draws || {},
      };
    } catch (error) {
      console.warn("读取本地数据失败", error);
      return defaultState();
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function getInitialView() {
    const allowed = ["overview", "participants", "draw", "dispatch", "settings"];
    const fromHash = window.location.hash.replace("#", "");
    return allowed.includes(fromHash) ? fromHash : "overview";
  }

  function formatDate(dateString, withWeekday = false) {
    const date = new Date(`${dateString}T12:00:00`);
    if (Number.isNaN(date.getTime())) return dateString;
    return new Intl.DateTimeFormat("zh-CN", {
      month: "long",
      day: "numeric",
      ...(withWeekday ? { weekday: "short" } : {}),
    }).format(date);
  }

  function initials(name) {
    return [...String(name || "?").replace(/\s/g, "")].slice(-2).join("");
  }

  function eventName(code) {
    return EVENT_META[code]?.name || code;
  }

  function entriesFor(code) {
    return state.participants.filter((entry) => entry.event === code);
  }

  function getDraw(code) {
    return state.draws[code] || null;
  }

  function getTeam(draw, teamId) {
    return draw?.teams?.find((team) => team.id === teamId) || null;
  }

  function allMatches() {
    return Object.values(state.draws).flatMap((draw) => draw.matches || []);
  }

  function scheduledMatches() {
    return allMatches()
      .filter((match) => match.schedule)
      .sort((left, right) => {
        const leftKey = `${left.schedule.date} ${left.schedule.time}`;
        const rightKey = `${right.schedule.date} ${right.schedule.time}`;
        return leftKey.localeCompare(rightKey, "zh-CN");
      });
  }

  function unfinishedMatches() {
    return allMatches().filter((match) => !match.winnerId);
  }

  function matchTeamName(match, side) {
    const draw = state.draws[match.event];
    if (!draw) return "待定";
    const teamId = side === "a" ? match.teamAId : match.teamBId;
    return getTeam(draw, teamId)?.name || "待定";
  }

  function matchCode(match) {
    return `${EVENT_META[match.event]?.short || "比赛"} · ${STAGE_LABELS[match.stage] || ""}${
      match.group ? ` ${match.group}组` : ""
    }`;
  }

  function staffFor(id) {
    return state.staff.find((person) => person.id === id) || null;
  }

  function courtFor(id) {
    return state.courts.find((court) => court.id === id) || null;
  }

  function toast(message, type = "success") {
    const node = document.getElementById("toast");
    window.clearTimeout(toastTimer);
    node.textContent = message;
    node.className = `toast show${type === "error" ? " error" : ""}`;
    toastTimer = window.setTimeout(() => {
      node.className = "toast";
    }, 2600);
  }

  function entrySignature(code) {
    return entriesFor(code)
      .map((entry) => entry.id)
      .sort()
      .join("|");
  }

  function isDrawStale(draw, code) {
    return Boolean(draw && draw.entrySignature !== entrySignature(code));
  }

  function createTeams(code) {
    const entries = entriesFor(code);
    if (code !== "xd") {
      return {
        teams: entries.map((entry) => ({
          id: makeId("team"),
          name: entry.name,
          department: entry.department,
          memberIds: [entry.id],
          memberPersonIds: [entry.personId],
          members: [{ name: entry.name, department: entry.department, pool: "" }],
        })),
        pairing: null,
        unpaired: [],
      };
    }

    const poolA = shuffle(entries.filter((entry) => entry.pool === "A"));
    const poolB = shuffle(entries.filter((entry) => entry.pool === "B"));
    const pairCount = Math.min(poolA.length, poolB.length);
    const teams = [];
    for (let index = 0; index < pairCount; index += 1) {
      const a = poolA[index];
      const b = poolB[index];
      teams.push({
        id: makeId("team"),
        name: `${a.name} / ${b.name}`,
        department: [...new Set([a.department, b.department])].join("、"),
        memberIds: [a.id, b.id],
        memberPersonIds: [a.personId, b.personId],
        members: [
          { name: a.name, department: a.department, pool: "A" },
          { name: b.name, department: b.department, pool: "B" },
        ],
      });
    }
    return {
      teams,
      pairing: {
        aCount: poolA.length,
        bCount: poolB.length,
        pairCount,
      },
      unpaired: [...poolA.slice(pairCount), ...poolB.slice(pairCount)].map((entry) => ({
        id: entry.id,
        name: entry.name,
        pool: entry.pool,
      })),
    };
  }

  function roundRobinMatches(teamIds, event, group) {
    const matches = [];
    for (let left = 0; left < teamIds.length; left += 1) {
      for (let right = left + 1; right < teamIds.length; right += 1) {
        matches.push({
          id: makeId("match"),
          event,
          stage: "group",
          group,
          teamAId: teamIds[left],
          teamBId: teamIds[right],
          scoreA: null,
          scoreB: null,
          winnerId: null,
          loserId: null,
          schedule: null,
        });
      }
    }
    return matches;
  }

  function createDraw(code) {
    if (!EVENT_META[code]) throw new Error("比赛项目不存在");
    if (code === "xd") {
      const poolA = entriesFor(code).filter((entry) => entry.pool === "A");
      const poolB = entriesFor(code).filter((entry) => entry.pool === "B");
      if (poolA.length < 2 || poolB.length < 2) {
        throw new Error("混双抽签至少需要 A、B 组各 2 人");
      }
    } else if (entriesFor(code).length < 4) {
      throw new Error(`${eventName(code)}至少需要 4 名参赛人员`);
    }

    const { teams, pairing, unpaired } = createTeams(code);
    if (teams.length < 4) {
      throw new Error("可参与抽签的组合不足 4 组");
    }
    const groupBuckets = { A: [], B: [], C: [], D: [] };
    shuffle(teams).forEach((team, index) => {
      groupBuckets[GROUP_NAMES[index % GROUP_NAMES.length]].push(team.id);
    });

    const matches = GROUP_NAMES.flatMap((group) =>
      roundRobinMatches(groupBuckets[group], code, group)
    );

    state.draws[code] = {
      event: code,
      createdAt: new Date().toISOString(),
      entrySignature: entrySignature(code),
      teams,
      groups: groupBuckets,
      matches,
      pairing,
      unpaired,
    };
    saveState();
  }

  function getGroupMatches(draw, group) {
    return draw.matches.filter((match) => match.stage === "group" && match.group === group);
  }

  function getStageMatches(draw, stage) {
    return draw.matches.filter((match) => match.stage === stage);
  }

  function groupStandings(draw, group) {
    return (draw.groups[group] || []).map((teamId) => {
      const team = getTeam(draw, teamId);
      const matches = getGroupMatches(draw, group).filter(
        (match) => match.teamAId === teamId || match.teamBId === teamId
      );
      let wins = 0;
      let losses = 0;
      let scored = 0;
      let conceded = 0;
      matches.forEach((match) => {
        if (match.winnerId !== teamId) {
          if (match.winnerId) losses += 1;
          return;
        }
        wins += 1;
        scored += match.teamAId === teamId ? match.scoreA : match.scoreB;
        conceded += match.teamAId === teamId ? match.scoreB : match.scoreA;
      });
      return {
        teamId,
        team,
        played: matches.filter((match) => match.winnerId).length,
        wins,
        losses,
        scored,
        conceded,
        diff: scored - conceded,
      };
    }).sort((left, right) => {
      if (right.wins !== left.wins) return right.wins - left.wins;
      if (right.diff !== left.diff) return right.diff - left.diff;
      if (right.scored !== left.scored) return right.scored - left.scored;
      return (left.team?.name || "").localeCompare(right.team?.name || "", "zh-CN");
    });
  }

  function allGroupMatchesFinished(draw) {
    return draw.matches.some((match) => match.stage === "group") &&
      draw.matches.filter((match) => match.stage === "group").every((match) => Boolean(match.winnerId));
  }

  function canGenerateQuarter(draw) {
    return allGroupMatchesFinished(draw) &&
      GROUP_NAMES.every((group) => (draw.groups[group] || []).length >= 2) &&
      getStageMatches(draw, "quarter").length === 0;
  }

  function qualifiedTeams(draw) {
    return Object.fromEntries(GROUP_NAMES.map((group) => [
      group,
      groupStandings(draw, group).slice(0, 2).map((standing) => standing.teamId),
    ]));
  }

  function generateQuarterfinals(code) {
    const draw = getDraw(code);
    if (!draw || !canGenerateQuarter(draw)) {
      throw new Error("请先完成全部小组赛并录入比分");
    }
    const q = qualifiedTeams(draw);
    const pairings = [
      [q.A[0], q.B[1]],
      [q.B[0], q.C[1]],
      [q.C[0], q.D[1]],
      [q.D[0], q.A[1]],
    ];
    pairings.forEach(([teamAId, teamBId]) => {
      draw.matches.push({
        id: makeId("match"),
        event: code,
        stage: "quarter",
        group: "",
        teamAId,
        teamBId,
        scoreA: null,
        scoreB: null,
        winnerId: null,
        loserId: null,
        schedule: null,
      });
    });
    saveState();
  }

  function canGenerateSemifinals(draw) {
    const quarters = getStageMatches(draw, "quarter");
    return quarters.length === 4 &&
      quarters.every((match) => match.winnerId) &&
      getStageMatches(draw, "semi").length === 0;
  }

  function generateSemifinals(code) {
    const draw = getDraw(code);
    if (!draw || !canGenerateSemifinals(draw)) {
      throw new Error("请先完成全部八强赛");
    }
    const winners = shuffle(getStageMatches(draw, "quarter").map((match) => match.winnerId));
    [[winners[0], winners[1]], [winners[2], winners[3]]].forEach(([teamAId, teamBId]) => {
      draw.matches.push({
        id: makeId("match"),
        event: code,
        stage: "semi",
        group: "",
        teamAId,
        teamBId,
        scoreA: null,
        scoreB: null,
        winnerId: null,
        loserId: null,
        schedule: null,
      });
    });
    saveState();
  }

  function canGenerateMedals(draw) {
    const semis = getStageMatches(draw, "semi");
    return semis.length === 2 &&
      semis.every((match) => match.winnerId) &&
      getStageMatches(draw, "final").length === 0 &&
      getStageMatches(draw, "third").length === 0;
  }

  function generateMedalMatches(code) {
    const draw = getDraw(code);
    if (!draw || !canGenerateMedals(draw)) {
      throw new Error("请先完成两场半决赛");
    }
    const semis = getStageMatches(draw, "semi");
    draw.matches.push({
      id: makeId("match"),
      event: code,
      stage: "third",
      group: "",
      teamAId: semis[0].loserId,
      teamBId: semis[1].loserId,
      scoreA: null,
      scoreB: null,
      winnerId: null,
      loserId: null,
      schedule: null,
    });
    draw.matches.push({
      id: makeId("match"),
      event: code,
      stage: "final",
      group: "",
      teamAId: semis[0].winnerId,
      teamBId: semis[1].winnerId,
      scoreA: null,
      scoreB: null,
      winnerId: null,
      loserId: null,
      schedule: null,
    });
    saveState();
  }

  function findMatch(matchId) {
    for (const [event, draw] of Object.entries(state.draws)) {
      const match = draw.matches?.find((item) => item.id === matchId);
      if (match) return { draw, event, match };
    }
    return null;
  }

  function recordScore(matchId, scoreA, scoreB) {
    const found = findMatch(matchId);
    if (!found) throw new Error("未找到该场比赛");
    const { draw, match } = found;
    if (match.stage === "group" && getStageMatches(draw, "quarter").length) {
      throw new Error("八强已生成，如需修改小组比分，请先重新抽签");
    }
    if (match.stage === "quarter" && getStageMatches(draw, "semi").length) {
      throw new Error("半决赛已生成，不能修改八强比分");
    }
    if (["semi", "final", "third"].includes(match.stage)) {
      const hasNext = getStageMatches(draw, "final").length > 0;
      if (match.stage === "semi" && hasNext) {
        throw new Error("决赛对阵已生成，不能修改半决赛比分");
      }
    }
    const a = Number(scoreA);
    const b = Number(scoreB);
    if (!Number.isInteger(a) || !Number.isInteger(b) || a < 0 || b < 0) {
      throw new Error("请输入有效比分");
    }
    if (a === b) throw new Error("一局定胜负，比分不能相同");
    if (Math.max(a, b) < 21) throw new Error("胜方至少达到 21 分");
    match.scoreA = a;
    match.scoreB = b;
    match.winnerId = a > b ? match.teamAId : match.teamBId;
    match.loserId = a > b ? match.teamBId : match.teamAId;
    saveState();
  }

  function playerConflict(match, time, exceptMatchId) {
    const found = findMatch(match.id);
    if (!found) return false;
    const teamPersonIds = [match.teamAId, match.teamBId].flatMap((teamId) =>
      getTeam(found.draw, teamId)?.memberPersonIds || []
    );
    return allMatches().some((other) => {
      if (other.id === exceptMatchId || !other.schedule || other.schedule.time !== time) return false;
      const otherEvent = state.draws[other.event];
      const otherPeople = [other.teamAId, other.teamBId].flatMap((teamId) =>
        getTeam(otherEvent, teamId)?.memberPersonIds || []
      );
      return otherPeople.some((personId) => teamPersonIds.includes(personId));
    });
  }

  function schedulingConflicts(match, date, time, courtId, staffId, exceptMatchId = match.id) {
    const conflicts = [];
    for (const other of allMatches()) {
      if (other.id === exceptMatchId || !other.schedule) continue;
      if (other.schedule.date !== date || other.schedule.time !== time) continue;
      if (other.schedule.courtId === courtId) conflicts.push("该场地此时段已有比赛");
      if (staffId && other.schedule.staffId === staffId) conflicts.push("该工作人员此时段已有任务");
    }
    if (playerConflict(match, time, exceptMatchId)) {
      conflicts.push("有参赛人员同时段参加其他比赛");
    }
    return [...new Set(conflicts)];
  }

  function scheduleMatch(matchId, date, time, courtId, staffId = "") {
    const found = findMatch(matchId);
    if (!found) throw new Error("未找到该场比赛");
    const { match } = found;
    if (!match.teamAId || !match.teamBId) throw new Error("双方尚未确定");
    if (!date || !time || !courtId) throw new Error("请选择日期、时段和场地");
    const conflicts = schedulingConflicts(match, date, time, courtId, staffId, match.id);
    if (conflicts.length) throw new Error(conflicts[0]);
    match.schedule = { date, time, courtId, staffId };
    saveState();
  }

  function unscheduleMatch(matchId) {
    const found = findMatch(matchId);
    if (!found) return;
    found.match.schedule = null;
    saveState();
  }

  function autoScheduleAll() {
    const activeCourts = state.courts.filter((court) => court.active);
    const activeStaff = state.staff.filter((person) => person.active);
    if (!activeCourts.length) throw new Error("请至少启用一个比赛场地");
    const queue = unfinishedMatches()
      .filter((match) => !match.schedule && match.teamAId && match.teamBId)
      .sort((left, right) => {
        if (left.event !== right.event) {
          return EVENT_META[left.event].order - EVENT_META[right.event].order;
        }
        if (STAGE_ORDER[left.stage] !== STAGE_ORDER[right.stage]) {
          return STAGE_ORDER[left.stage] - STAGE_ORDER[right.stage];
        }
        return (left.group || "").localeCompare(right.group || "");
      });

    let scheduled = 0;
    let unstaffed = 0;
    const failed = [];
    queue.forEach((match) => {
      let placed = false;
      for (const time of state.config.times) {
        if (placed) break;
        for (const court of activeCourts) {
          if (schedulingConflicts(match, state.config.date, time, court.id, "", match.id).length) {
            continue;
          }
          const availableStaff = activeStaff.find((person) =>
            !schedulingConflicts(match, state.config.date, time, court.id, person.id, match.id).length
          );
          match.schedule = {
            date: state.config.date,
            time,
            courtId: court.id,
            staffId: availableStaff?.id || "",
          };
          if (!availableStaff) unstaffed += 1;
          scheduled += 1;
          placed = true;
          break;
        }
      }
      if (!placed) failed.push(match);
    });
    saveState();
    return { scheduled, unstaffed, failed: failed.length };
  }

  function resultsFor(event) {
    const draw = getDraw(event);
    if (!draw) return null;
    const final = getStageMatches(draw, "final")[0];
    const third = getStageMatches(draw, "third")[0];
    if (!final?.winnerId) return null;
    return {
      champion: getTeam(draw, final.winnerId)?.name || "",
      runnerUp: getTeam(draw, final.loserId)?.name || "",
      third: third?.winnerId ? getTeam(draw, third.winnerId)?.name || "" : "待定",
    };
  }

  function scheduleStats() {
    const matches = allMatches().filter((match) => match.teamAId && match.teamBId);
    const completed = matches.filter((match) => match.winnerId).length;
    const scheduled = matches.filter((match) => match.schedule).length;
    return { total: matches.length, completed, scheduled };
  }

      ...getStageMatches(draw, "final"),

    const final = getStageMatches(draw, "final")[0];
    const champion = final?.winnerId ? getTeam(draw, final.winnerId) : null;
    return `
      <section class="bracket-card">
        <div class="bracket-topbar">
          <div>
            <h2>淘汰赛对阵</h2>
            <p>八强按 A1–B2、B1–C2、C1–D2、D1–A2 交叉；半决赛随机配对。</p>

            <div class="bracket-round">
              <div class="bracket-round-title">半决赛</div>

              <div class="round-matches">

            </div>
            <div class="final-column">
              <div class="bracket-round-title">冠军</div>
              <div class="champion-card">

                <small>FIRST PLACE</small>
                <strong>${esc(champion?.name || "等待决赛")}</strong>
                ${champion ? `<span style="display:block;margin-top:4px;color:#8c7b51;font-size:9px">${esc(champion.department)}</span>` : ""}
              </div>
            </div>
          </div>
        </div>
      </section>

  function renderProgressionAction(draw, code) {
    if (canGenerateQuarter(draw)) {
      return `<button class="button primary small" type="button" data-action="generate-quarter" data-event="${code}">${icons.arrow} 生成八强对阵</button>`;
    }
    if (canGenerateSemifinals(draw)) {
      return `<button class="button primary small" type="button" data-action="generate-semi" data-event="${code}">${icons.shuffle} 随机配对半决赛</button>`;
    }
    if (canGenerateMedals(draw)) {
      return `<button class="button primary small" type="button" data-action="generate-medals" data-event="${code}">${icons.arrow} 生成决赛与季军赛</button>`;
    }
    if (getStageMatches(draw, "quarter").length === 0) {
      const total = draw.matches.filter((match) => match.stage === "group").length;
      const done = draw.matches.filter((match) => match.stage === "group" && match.winnerId).length;
      return `<span class="status-pill gray">小组赛 ${done} / ${total} 场</span>`;
    }
    return `<span class="status-pill">赛程推进中</span>`;
  }

  function scheduledAt(date, time, courtId) {
    return allMatches().find((match) =>
      match.schedule?.date === date &&
      match.schedule?.time === time &&
      match.schedule?.courtId === courtId
    ) || null;
  }

  function scheduleIssueCount() {
    const matches = scheduledMatches().filter((match) => !match.winnerId);
    const issues = [];
    matches.forEach((match) => {
      const conflicts = schedulingConflicts(
        match,
        match.schedule.date,
        match.schedule.time,
        match.schedule.courtId,
        match.schedule.staffId,
        match.id
      );
      if (conflicts.length) issues.push(match.id);
    });
    return new Set(issues).size;
  }

  function renderTimeline() {
    const activeCourts = state.courts.filter((court) => court.active);
    const date = state.config.date;
    return `
      <div class="timeline">
        <div class="timeline-grid" style="--court-count:${Math.max(activeCourts.length, 1)}">
          <div class="timeline-cell header">时段</div>
          ${activeCourts.length ? activeCourts.map((court) => `
            <div class="timeline-cell header">${esc(court.name)}</div>
          `).join("") : `<div class="timeline-cell header">暂无启用场地</div>`}
          ${state.config.times.map((time) => `
            <div class="timeline-cell time">${esc(time)}<span>${time < "12:00" ? "上午" : "下午"}</span></div>
            ${activeCourts.length ? activeCourts.map((court) => {
              const match = scheduledAt(date, time, court.id);
              if (!match) {
                return `
                  <div class="timeline-cell">
                    <button class="slot-add" type="button" data-action="open-schedule" data-time="${time}" data-court="${court.id}">+ 安排比赛</button>
                  </div>
                `;
              }
              const staff = staffFor(match.schedule.staffId);
              const warning = schedulingConflicts(match, date, time, court.id, match.schedule.staffId, match.id).length > 0;
              return `
                <div class="timeline-cell">
                  <button class="scheduled-match ${warning ? "warning" : ""}" type="button" data-action="match-detail" data-id="${match.id}" style="width:100%;text-align:left">
                    <strong>${esc(matchTeamName(match, "a"))}</strong>
                    <span>vs ${esc(matchTeamName(match, "b"))}</span>
                    <b>${esc(staff?.name || "待配工作人员")}</b>
                  </button>
                </div>
              `;
            }).join("") : `<div class="timeline-cell"><span class="status-pill warning">请启用场地</span></div>`}
          `).join("")}
        </div>
      </div>
    `;
  }

  function renderModal() {
    const root = document.getElementById("modal-root");
    if (!ui.modal) {
      root.innerHTML = "";
      document.body.style.overflow = "";
      return;
    }
    let content = "";
    const { type, payload } = ui.modal;
    if (type === "participant") content = participantModal(payload);
    else if (type === "batch") content = batchImportModal();
    else if (type === "config") content = configModal();
    else if (type === "score") content = scoreModal(payload);
    else if (type === "match-detail") content = matchDetailModal(payload);
    else if (type === "schedule") content = scheduleModal(payload);
    else if (type === "staff") content = staffListModal();
    else if (type === "court") content = courtListModal();
    else if (type === "unscheduled") content = unscheduledModal();
    else if (type === "confirm") content = confirmModal(payload);
    else content = modalShell({ title: "提示", body: "<p>未知操作</p>" });
    root.innerHTML = content;
    document.body.style.overflow = "hidden";
    window.setTimeout(() => {
      const focusTarget = root.querySelector("input:not([type=hidden]), textarea, select");
      focusTarget?.focus({ preventScroll: true });
    }, 30);
  }

  function downloadFile(filename, content, type = "text/plain;charset=utf-8") {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = filename;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
