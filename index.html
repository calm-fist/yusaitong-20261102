    downloadFile(
      `羽毛球参赛名单-${state.config.date}.csv`,
      `\uFEFF${[header.map(csvCell).join(","), ...lines].join("\r\n")}`,
      "text/csv;charset=utf-8"
    );
    toast("参赛名单已导出，可用 Excel 打开");
  }

  function importBackupFile() {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".json,application/json";
    input.style.display = "none";
    document.body.appendChild(input);
    input.addEventListener("change", async () => {
      const file = input.files?.[0];
      if (!file) {
        input.remove();
        return;
      }
      try {
        const parsed = JSON.parse(await file.text());
        if (!parsed.config || !Array.isArray(parsed.participants) || !parsed.draws) {
          throw new Error("备份文件结构不正确");
        }
        state = {
          ...defaultState(),
          ...parsed,
          config: { ...defaultState().config, ...parsed.config },
          draws: parsed.draws || {},
          staff: Array.isArray(parsed.staff) ? parsed.staff : initialStaff(),
          courts: Array.isArray(parsed.courts) ? parsed.courts : initialCourts(),
        };
        saveState();
        ui.scheduleDate = state.config.date;
        closeModal();
        renderApp();
        toast("备份已恢复");
      } catch (error) {
        toast(error.message || "无法读取备份文件", "error");
      } finally {
        input.remove();
      }
    });
    input.click();
  }

  function copyText(text) {
    if (navigator.clipboard?.writeText) {
      return navigator.clipboard.writeText(text);
    }
    const input = document.createElement("textarea");
    input.value = text;
    input.style.position = "fixed";
    input.style.opacity = "0";
    document.body.appendChild(input);
    input.select();
    document.execCommand("copy");
    input.remove();
    return Promise.resolve();
  }

  function parseEvent(value) {
    const normalized = String(value || "").trim().toLocaleLowerCase("zh-CN");
    if (/男单|男子单打|^ms$/.test(normalized)) return "ms";
    if (/女单|女子单打|^ws$/.test(normalized)) return "ws";
    if (/混双|混合双打|^xd$/.test(normalized)) return "xd";
    return null;
  }

  function normalizeGender(value, event) {
    if (/女|^f$|^female$/i.test(String(value || "").trim())) return "F";
    if (/男|^m$|^male$/i.test(String(value || "").trim())) return "M";
    if (event === "ws") return "F";
    if (event === "ms") return "M";
    return "";
  }

  function personKey(name, department) {
    return `${String(name || "").trim().toLocaleLowerCase("zh-CN")}|${String(department || "").trim().toLocaleLowerCase("zh-CN")}`;
  }

  function findPersonId(name, department) {
    const key = personKey(name, department);
    return state.participants.find((entry) => personKey(entry.name, entry.department) === key)?.personId;
  }

  function hasDuplicateRegistration(personId, event, pool, exceptId = "") {
    return state.participants.some((entry) =>
      entry.id !== exceptId &&
      entry.personId === personId &&
      entry.event === event &&
      (event !== "xd" || entry.pool === pool)
    );
  }

  function saveParticipant(form) {
    const data = new FormData(form);
    const id = String(data.get("id") || "");
    const name = String(data.get("name") || "").trim();
    const department = String(data.get("department") || "").trim();
    const gender = String(data.get("gender") || "");
    const event = String(data.get("event") || "");
    const pool = event === "xd" ? String(data.get("pool") || "") : "";
    const phone = String(data.get("phone") || "").trim();
    const seed = data.get("seed") === "on";
    if (!name || !department) throw new Error("请填写姓名和所属单位");
    if (!EVENT_META[event]) throw new Error("请选择有效比赛项目");
    if (event === "xd" && !["A", "B"].includes(pool)) throw new Error("混双人员必须选择 A 组或 B 组池");
    const existing = state.participants.find((entry) => entry.id === id);
    const personId = existing?.personId || findPersonId(name, department) || makeId("person");
    if (hasDuplicateRegistration(personId, event, pool, id)) {
      throw new Error("该人员在同一项目中已经报名");
    }
    if (existing) {
      Object.assign(existing, { name, department, gender, event, pool, phone, seed });
    } else {
      state.participants.push({
        id: makeId("entry"),
        personId,
        name,
        department,
        gender,
        event,
        pool,
        phone,
        seed,
        demo: false,
      });
    }
    state.config.demo = state.participants.some((entry) => entry.demo);
    saveState();
    closeModal();
    renderApp();
    toast(existing ? "参赛信息已更新" : "参赛人员已录入");
  }

  function saveBatch(form) {
    const data = new FormData(form);
    const raw = String(data.get("text") || "");
    const replaceDemo = data.get("replaceDemo") === "on";
    const rows = raw.split(/\r?\n/).map((line) => line.trim()).filter((line) => line && !line.startsWith("#"));
    if (!rows.length) throw new Error("请粘贴参赛名单");
    const parsed = [];
    const errors = [];
    rows.forEach((line, index) => {
      const columns = line.split(/\t|,|，/).map((value) => value.trim());
      const [name, department, genderValue, eventValue, poolValue = "", phone = ""] = columns;
      const event = parseEvent(eventValue);
      const gender = normalizeGender(genderValue, event);
      const pool = event === "xd" ? poolValue.toUpperCase() : "";
      if (!name || !department || !event || !["M", "F"].includes(gender)) {
        errors.push(`第 ${index + 1} 行信息不完整`);
        return;
      }
      if (event === "xd" && !["A", "B"].includes(pool)) {
        errors.push(`第 ${index + 1} 行混双组别须为 A 或 B`);
        return;
      }
      parsed.push({ name, department, gender, event, pool, phone });
    });
    if (errors.length) {
      throw new Error(`${errors.slice(0, 2).join("；")}${errors.length > 2 ? `，另有 ${errors.length - 2} 行错误` : ""}`);
    }
    if (replaceDemo) state.participants = state.participants.filter((entry) => !entry.demo);
    let added = 0;
    let skipped = 0;
    parsed.forEach((row) => {
      const personId = findPersonId(row.name, row.department) || makeId("person");
      if (hasDuplicateRegistration(personId, row.event, row.pool)) {
        skipped += 1;
        return;
      }
      state.participants.push({
        id: makeId("entry"),
        personId,
        ...row,
        seed: false,
        demo: false,
      });
      added += 1;
    });
    state.config.demo = state.participants.some((entry) => entry.demo);
    saveState();
    closeModal();
    renderApp();
    toast(`已导入 ${added} 条${skipped ? `，跳过 ${skipped} 条重复记录` : ""}`);
  }

  function saveConfig(form) {
    const data = new FormData(form);
    const times = String(data.get("times") || "")
      .split(/[\n,，]+/)
      .map((time) => time.trim())
      .filter(Boolean);
    if (!times.length || times.some((time) => !/^([01]\d|2[0-3]):[0-5]\d$/.test(time))) {
      throw new Error("赛程时段格式不正确，请使用 09:00 这样的格式");
    }
    state.config.name = String(data.get("name") || "").trim();
    state.config.date = String(data.get("date") || "");
    state.config.venue = String(data.get("venue") || "").trim();
    state.config.times = [...new Set(times)].sort();
    state.config.rules = String(data.get("rules") || "").trim();
    if (!state.config.name || !state.config.date || !state.config.venue) {
      throw new Error("赛事名称、日期和地点不能为空");
    }
    ui.scheduleDate = state.config.date;
    saveState();
    closeModal();
    renderApp();
    toast("赛事信息已保存");
  }

  function handleFormSubmit(event) {
    const form = event.target.closest("form[data-form]");
    if (!form) return;
    event.preventDefault();
    try {
      const type = form.dataset.form;
      if (type === "participant") saveParticipant(form);
      else if (type === "batch") saveBatch(form);
      else if (type === "config") saveConfig(form);
      else if (type === "score") {
        const data = new FormData(form);
        recordScore(
          String(data.get("matchId")),
          Number(data.get("scoreA")),
          Number(data.get("scoreB"))
        );
        closeModal();
        renderApp();
        toast("比分已保存，胜者已更新");
      } else if (type === "schedule") {
        const data = new FormData(form);
        scheduleMatch(
          String(data.get("matchId")),
          String(data.get("date")),
          String(data.get("time")),
          String(data.get("courtId")),
          String(data.get("staffId") || "")
        );
        closeModal();
        renderApp();
        toast("比赛已安排");
      } else if (type === "staff-add") {
        const data = new FormData(form);
        const name = String(data.get("name") || "").trim();
        if (!name) throw new Error("请填写工作人员姓名");
        state.staff.push({
          id: makeId("staff"),
          name,
          role: String(data.get("role") || "裁判员"),
          phone: String(data.get("phone") || "").trim(),
          active: true,
        });
        saveState();
        renderModal();
        toast("工作人员已添加");
      } else if (type === "court-add") {
        const data = new FormData(form);
        const name = String(data.get("name") || "").trim();
        if (!name) throw new Error("请填写场地名称");
        if (state.courts.some((court) => court.name === name)) throw new Error("该场地已存在");
        state.courts.push({ id: makeId("court"), name, active: true });
        saveState();
        renderModal();
        toast("比赛场地已添加");
      }
    } catch (error) {
      toast(error.message || "保存失败", "error");
    }
  }

  function refreshParticipantSearch() {
    const input = document.getElementById("participant-search");
    const { selectionStart, selectionEnd } = input || {};
    renderApp();
    const nextInput = document.getElementById("participant-search");
    if (nextInput) {
      nextInput.focus({ preventScroll: true });
      nextInput.setSelectionRange(selectionStart, selectionEnd);
    }
  }

  function handleInput(event) {
    if (event.target.id === "participant-search") {
      ui.participantQuery = event.target.value;
      refreshParticipantSearch();
    }
  }

  function handleChange(event) {
    if (event.target.id === "participant-event-filter") {
      ui.participantEvent = event.target.value;
      renderApp();
      return;
    }
    if (event.target.id === "participant-event") {
      const poolField = document.getElementById("participant-pool-field");
      const poolSelect = document.getElementById("participant-pool");
      const isMixed = event.target.value === "xd";
      if (poolField) poolField.style.display = isMixed ? "" : "none";
      if (poolSelect) {
        poolSelect.required = isMixed;
        if (!isMixed) poolSelect.value = "";
      }
      return;
    }
    const action = event.target.dataset.action;
    if (action === "toggle-staff") {
      const person = staffFor(event.target.dataset.id);
      if (!person) return;
      person.active = event.target.checked;
      if (!person.active) {
        allMatches().forEach((match) => {
          if (match.schedule?.staffId === person.id) match.schedule.staffId = "";
        });
      }
      saveState();
      renderModal();
      toast(`${person.name}已${person.active ? "上岗" : "停用"}`);
      return;
    }
    if (action === "toggle-court") {
      const court = courtFor(event.target.dataset.id);
      if (!court) return;
      if (!event.target.checked) {
        const used = scheduledMatches().some((match) => match.schedule.courtId === court.id && !match.winnerId);
        if (used) {
          event.target.checked = true;
          toast("该场地仍有未完成比赛，请先调整对应场次", "error");
          return;
        }
      }
      court.active = event.target.checked;
      saveState();
      renderModal();
      toast(`${court.name}已${court.active ? "启用" : "停用"}`);
    }
  }

  function confirmDeleteParticipant(id) {
    const entry = state.participants.find((item) => item.id === id);
    if (!entry) return;
    state.participants = state.participants.filter((item) => item.id !== id);
    if (!groupHasOtherEntry(entry)) {
      // The person may have registrations in other events; keep the stable person id alive there.
    }
    state.config.demo = state.participants.some((item) => item.demo);
    saveState();
    closeModal();
    renderApp();
    toast("参赛记录已删除");
  }

  function groupHasOtherEntry(entry) {
    return state.participants.some((item) => item.id !== entry.id && item.personId === entry.personId);
  }

  function executeConfirm(action, id = "") {
    try {
      if (action === "delete-participant-confirm") {
        confirmDeleteParticipant(id);
      } else if (action === "redraw-confirm") {
        createDraw(id);
        ui.drawEvent = id;
        closeModal();
        renderApp();
        toast(`${eventName(id)}已完成重新抽签`);
      } else if (action === "reset-demo-confirm") {
        state = defaultState();
        ui.drawEvent = "ms";
        ui.participantEvent = "all";
        ui.participantQuery = "";
        closeModal();
        renderApp();
        toast("已恢复示例数据");
      } else if (action === "clear-all-confirm") {
        state.participants = [];
        state.draws = {};
        state.config.demo = false;
        closeModal();
        renderApp();
        toast("比赛数据已清空，工作人员和场地设置已保留");
      } else if (action === "delete-staff-confirm") {
        state.staff = state.staff.filter((person) => person.id !== id);
        allMatches().forEach((match) => {
          if (match.schedule?.staffId === id) match.schedule.staffId = "";
        });
        saveState();
        closeModal();
        renderApp();
        toast("工作人员已删除");
      } else if (action === "delete-court-confirm") {
        const used = scheduledMatches().some((match) => match.schedule.courtId === id && !match.winnerId);
        if (used) throw new Error("该场地仍有未完成比赛，不能删除");
        state.courts = state.courts.filter((court) => court.id !== id);
        saveState();
        closeModal();
        renderApp();
        toast("场地已删除");
      }
    } catch (error) {
      closeModal();
      toast(error.message || "操作失败", "error");
    }
  }

  function handleClick(event) {
    const nav = event.target.closest("[data-nav]");
    if (nav) {
      event.preventDefault();
      navigate(nav.dataset.nav);
      return;
    }

    const actionTarget = event.target.closest("[data-action]");
    if (!actionTarget) return;
    if (
      actionTarget.classList.contains("modal-backdrop") &&
      event.target !== actionTarget
    ) {
      return;
    }
    const action = actionTarget.dataset.action;
    const id = actionTarget.dataset.id || "";
    const targetEvent = actionTarget.dataset.event || "";
    try {
      if (action === "close-modal") {
        closeModal();
      } else if (action === "open-participant") {
        openModal("participant");
      } else if (action === "edit-participant") {
        openModal("participant", { id });
      } else if (action === "open-batch-import") {
        openModal("batch");
      } else if (action === "delete-participant") {
        const entry = state.participants.find((item) => item.id === id);
        if (!entry) return;
        openModal("confirm", {
          title: "删除参赛记录",
          heading: `删除 ${entry.name} 的${eventName(entry.event)}报名？`,
          body: "如果该人员还参加其他项目，其他报名记录不会受到影响。已有抽签不会自动重排，但会被提示重新抽签。",
          confirmAction: "delete-participant-confirm",
          confirmLabel: "删除记录",
          danger: true,
          id,
        });
      } else if (action === "participant-filter") {
        ui.participantEvent = targetEvent;
        renderApp();
      } else if (action === "sort-participants") {
        const key = actionTarget.dataset.key;
        if (ui.sortKey === key) ui.sortDirection *= -1;
        else {
          ui.sortKey = key;
          ui.sortDirection = 1;
        }
        renderApp();
      } else if (action === "select-draw") {
        ui.drawEvent = targetEvent;
        navigate("draw");
      } else if (action === "create-draw") {
        createDraw(targetEvent);
        ui.drawEvent = targetEvent;
        renderApp();
        toast(`${eventName(targetEvent)}抽签完成`);
      } else if (action === "draw-all") {
        let created = 0;
        const skipped = [];
        Object.keys(EVENT_META).forEach((code) => {
          if (getDraw(code)) return;
          try {
            createDraw(code);
            created += 1;
          } catch (error) {
            skipped.push(eventName(code));
          }
        });
        renderApp();
        if (created) toast(`已完成 ${created} 个项目的抽签${skipped.length ? `；${skipped.join("、")}人数不足` : ""}`);
        else toast(skipped.length ? `${skipped.join("、")}尚不满足抽签人数或已有分组` : "所有项目均已有抽签", "error");
      } else if (action === "redraw") {
        openModal("confirm", {
          title: "重新抽签",
          heading: `重新生成${eventName(targetEvent)}分组？`,
          body: "现有小组赛比分、淘汰赛对阵和已安排场次都会失效，请确认当前赛程尚未开始或确需重排。",
          confirmAction: "redraw-confirm",
          confirmLabel: "确认重新抽签",
          danger: true,
          id: targetEvent,
        });
      } else if (action === "open-score") {
        openModal("score", { id });
      } else if (action === "match-detail") {
        openModal("match-detail", { id });
      } else if (action === "open-schedule") {
        openModal("schedule", {
          id,
          time: actionTarget.dataset.time || "",
          court: actionTarget.dataset.court || "",
        });
      } else if (action === "unschedule") {
        unscheduleMatch(id);
        closeModal();
        renderApp();
        toast("已取消该场排程");
      } else if (action === "auto-schedule") {
        const result = autoScheduleAll();
        closeModal();
        renderApp();
        if (result.scheduled) {
          toast(`已自动安排 ${result.scheduled} 场${result.failed ? `，${result.failed} 场因容量不足待调整` : ""}${result.unstaffed ? `，${result.unstaffed} 场待配工作人员` : ""}`);
        } else {
          toast(result.failed ? "时段容量不足，请增加时段或场地" : "没有需要安排的新场次", "error");
        }
      } else if (action === "generate-quarter") {
        generateQuarterfinals(targetEvent);
        renderApp();
        toast("八强对阵已生成");
      } else if (action === "generate-semi") {
        generateSemifinals(targetEvent);
        renderApp();
        toast("半决赛已完成随机配对");
      } else if (action === "generate-medals") {
        generateMedalMatches(targetEvent);
        renderApp();
        toast("决赛与季军赛已生成");
      } else if (action === "open-staff" || action === "edit-staff") {
        openModal("staff");
      } else if (action === "open-court") {
        openModal("court");
      } else if (action === "delete-staff") {
        const person = staffFor(id);
        if (!person) return;
        openModal("confirm", {
          title: "删除工作人员",
          heading: `删除 ${person.name}？`,
          body: "已分配给该工作人员的比赛会变为“待配工作人员”。",
          confirmAction: "delete-staff-confirm",
          confirmLabel: "删除",
          danger: true,
          id,
        });
      } else if (action === "delete-court") {
        const court = courtFor(id);
        if (!court) return;
        openModal("confirm", {
          title: "删除比赛场地",
          heading: `删除 ${court.name}？`,
          body: "只有没有未完成比赛引用该场地时才能删除；已有排程的比赛需先调整。",
          confirmAction: "delete-court-confirm",
          confirmLabel: "删除",
          danger: true,
          id,
        });
      } else if (action === "toggle-court" && !actionTarget.matches("input")) {
        const court = courtFor(id);
        if (!court) return;
        if (court.active) {
          const used = scheduledMatches().some((match) => match.schedule.courtId === id && !match.winnerId);
          if (used) throw new Error("该场地仍有未完成比赛，请先调整对应场次");
        }
        court.active = !court.active;
        saveState();
        renderApp();
        toast(`${court.name}已${court.active ? "启用" : "停用"}`);
      } else if (action === "show-all-unscheduled") {
        openModal("unscheduled");
      } else if (action === "edit-config") {
        openModal("config");
      } else if (action === "export-csv") {
        exportCsv();
      } else if (action === "export-backup") {
        exportBackup();
      } else if (action === "import-backup") {
        importBackupFile();
      } else if (action === "copy-share-link") {
        copyText(window.location.href).then(() => toast("页面链接已复制")).catch(() => {
          toast("当前环境无法自动复制，请从地址栏复制", "error");
        });
      } else if (action === "reset-demo") {
        openModal("confirm", {
          title: "恢复示例数据",
          heading: "覆盖当前全部赛事数据？",
          body: "当前名单、抽签、比分和排程会被替换为示例内容。请先导出备份。",
          confirmAction: "reset-demo-confirm",
          confirmLabel: "恢复示例",
          danger: true,
        });
      } else if (action === "clear-all") {
        openModal("confirm", {
          title: "清空比赛数据",
          heading: "确定清空所有参赛与比赛数据？",
          body: "将删除全部参赛人员、抽签、比分和排程；工作人员、场地和赛事信息设置会保留。此操作无法撤销。",
          confirmAction: "clear-all-confirm",
          confirmLabel: "确认清空",
          danger: true,
        });
      } else if (action.endsWith("-confirm")) {
        executeConfirm(action, id);
      }
    } catch (error) {
      toast(error.message || "操作失败", "error");
    }
  }

  function init() {
    document.addEventListener("click", handleClick);
    document.addEventListener("submit", handleFormSubmit);
    document.addEventListener("input", handleInput);
    document.addEventListener("change", handleChange);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && ui.modal) closeModal();
    });
    window.addEventListener("hashchange", () => {
      const nextView = getInitialView();
      if (nextView !== ui.view) {
        ui.view = nextView;
        renderApp();
      }
    });
    renderApp();
    if ("serviceWorker" in navigator && window.location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  }

  init();
})();

</script>
</body>
